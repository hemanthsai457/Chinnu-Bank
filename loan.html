<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinnu Bank - Loan Request</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Chinnu Bank 🏦</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="loan.html">Apply for a Loan</a>
            <a href="complaint.html">File a Complaint</a>
        </nav>
    </header>

    <main>
        <h2>Loan Request Form</h2>
        <form action="https://formsubmit.co/tunetherapynlp@gmail.com" method="POST">
            
            <input type="hidden" name="_cc" value="tunetherapynlp@gmail.com"> <input type="hidden" name="_next" value="https://hemanthsai457.github.io/Chinnu-Bank/thanks.html">
            <input type="hidden" name="_subject" value="NEW LOAN REQUEST: Chinnu Bank Website">
            
            
            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name" name="Full Name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="Email" required>

            <label for="loan_amount">Loan Amount (in rupees):</label>
            <input type="number" id="loan_amount" name="Loan Amount" min="1000" required>

            <label for="loan_purpose">Purpose of Loan:</label>
            <textarea id="loan_purpose" name="Purpose of Loan" rows="4" required></textarea>
            
            <button type="submit">Submit Loan Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Chinnu Bank</p>
    </footer>
</body>
</html>
