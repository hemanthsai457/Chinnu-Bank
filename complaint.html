<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinnu Bank - File a Complaint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Chinnu Bank 🏦</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="loan.html">Apply for a Loan</a>
            <a href="complaint.html">File a Complaint</a>
        </nav>
    </header>

    <main>
        <h2>File a Complaint</h2>
        <p>We are sorry to hear you've experienced an issue. Please provide details below so we can resolve this quickly.</p>

        <form action="https://formsubmit.co/tunetherapynlp@gmail.com" method="POST">
            
            <input type="hidden" name="_cc" value="tunetherapynlp@gmail.com"> 
            <input type="hidden" name="_autoresponse" value="Thank you. We acknowledge receipt of your complaint. A team member will investigate and respond within 48 hours.">
            <input type="hidden" name="_next" value="https://<Your-Username>.github.io/<Repository-Name>/thanks.html">
            <input type="hidden" name="_subject" value="NEW COMPLAINT FILED: Urgent Review Required">
            
            <label for="full_name">Your Full Name:</label>
            <input type="text" id="full_name" name="Full Name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="Email" required>
            
            <label for="account_number">Account Number (Optional):</label>
            <input type="text" id="account_number" name="Account Number">

            <label for="complaint_details">Details of Complaint:</label>
            <textarea id="complaint_details" name="Complaint Details" rows="6" required></textarea>
            
            <button type="submit">Submit Complaint</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Chinnu Bank</p>
    </footer>
</body>
</html>
